name: Backend
on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: club
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: club_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U club -d club_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://club:ci_local_only@localhost:5432/club_test
      DATABASE_URL: postgresql+psycopg://club:ci_local_only@localhost:5432/club_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations wsgi.py
      - run: ruff format --check app tests migrations wsgi.py
      - run: python -m pytest --cov=app --cov-report=term-missing
      - run: flask --app wsgi db check
