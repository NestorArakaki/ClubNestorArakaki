services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club_local
      POSTGRES_DB: club
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - club_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club"]
      interval: 3s
      timeout: 3s
      retries: 20
  test-db:
    image: postgres:16-bookworm
    profiles: ["test"]
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club_local
      POSTGRES_DB: club_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  club_db:
