# Desde Render > New Blueprint, seleccionar backend/render.yaml.
services:
  - type: web
    name: club-nestor-arakaki-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh scripts/start.sh
    healthCheckPath: /api/v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        fromDatabase:
          name: club-nestor-arakaki-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: REMINDER_SCHEDULER_KEY
        sync: false
      - key: FCM_ENABLED
        value: "false"
      - key: SEED_ON_START
        value: "false"
      - key: CORS_ORIGINS
        sync: false
databases:
  - name: club-nestor-arakaki-db
    plan: free
    databaseName: club
    user: club
    postgresMajorVersion: "16"
